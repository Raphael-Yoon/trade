<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonathan's Coffee House</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0f;
            color: #e2e8f0;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 360px;
            padding: 24px;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .logo h1 {
            font-size: 20px;
            font-weight: 700;
            color: #e2e8f0;
            letter-spacing: 0.5px;
        }

        .logo p {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 32px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 16px;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: border-color 0.2s;
            letter-spacing: 3px;
        }

        input[type="password"]:focus {
            border-color: rgba(99, 102, 241, 0.6);
        }

        .error {
            font-size: 12px;
            color: #f87171;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.85; }
        button:active { opacity: 0.7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">☕</div>
            <h1>Jonathan's Coffee House</h1>
            <p>트레이딩 시스템</p>
        </div>
        <div class="card">
            <form method="POST">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" inputmode="numeric" pattern="[0-9]*" autofocus autocomplete="current-password" placeholder="••••••••">
                {% if error %}
                <div class="error">⚠ {{ error }}</div>
                {% endif %}
                <button type="submit">입장</button>
            </form>
        </div>
    </div>
</body>
</html>
